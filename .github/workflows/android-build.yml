name: Build Android APK (Cloud Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the game repository
      - name: Checkout Game Source
        uses: actions/checkout@v4

      # 2. Setup JDK 17 (Required for modern Gradle & Android SDK tools)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Android SDK and NDK
      # ubuntu-latest runners have Android SDK pre-installed. We just need to pin the NDK version.
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> $GITHUB_ENV

      # 4. Clone SDL3 to extract the Android Gradle Project Template
      - name: Fetch SDL3 Source & Android Template
        run: |
          git clone --depth 1 --branch release-3.2.0 https://github.com/libsdl-org/SDL.git sdl3-source
          
          # Copy the android-project template to the workspace root
          cp -r sdl3-source/android-project ./android-build
          
          # Clean default files in app/jni/src
          rm -rf android-build/app/jni/src/*
          
          # Copy our game source code directly into the build folder
          cp -r src/* android-build/app/jni/src/
          
          # Use our custom android CMakeLists.txt to compile the sources as libmain.so
          cp android-CMakeLists.txt android-build/app/jni/src/CMakeLists.txt
          
          # Place the SDL3 source folder into app/jni/SDL so gradle can build it
          cp -r sdl3-source android-build/app/jni/SDL

          # Copy custom launcher icons for all Android screen densities
          if [ -d "assets/android" ]; then
            cp -r assets/android/* android-build/app/src/main/res/
          fi

          # Copy game assets into Android assets folder so they bundle inside the APK
          mkdir -p android-build/app/src/main/assets/assets
          cp -r assets/*.bmp android-build/app/src/main/assets/assets/ || true

      # 5. Build the Android project using Gradle wrapper
      - name: Build Debug APK with Gradle
        working-directory: ./android-build
        run: |
          # Configure build.gradle to compile for all major ABIs instead of just arm64-v8a
          sed -i "s/abiFilters 'arm64-v8a'/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'/g" app/build.gradle
          
          chmod +x gradlew
          ./gradlew assembleDebug -PBUILD_WITH_CMAKE=true

      # 6. Upload the compiled APK so the user can download it directly from GitHub
      - name: Prepare Named APK Package
        run: |
          cp android-build/app/build/outputs/apk/debug/app-debug.apk android-build/app/build/outputs/apk/debug/OneMoreMove.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneMoreMove-Android-APK
          path: android-build/app/build/outputs/apk/debug/OneMoreMove.apk
          if-no-files-found: error
          retention-days: 7
